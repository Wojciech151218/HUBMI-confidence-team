services:
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hubmi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/migrations/0001_create_initiatives.sql:/docker-entrypoint-initdb.d/0001_create_initiatives.sql:ro
      - ./db/migrations/0002_seed_initiatives.sql:/docker-entrypoint-initdb.d/0002_seed_initiatives.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hubmi"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3001:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hubmi
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: documents
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
      - /app/inbox
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: npm run dev

volumes:
  pgdata:
  miniodata:
  web_node_modules:
  web_next:
